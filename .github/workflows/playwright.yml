name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers (cached)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ hashFiles('**/package-lock.json') }}
        continue-on-error: true

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Build
        run: pnpm build

      - name: Start dev server
        run: |
          nohup pnpm dev --port 5174 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sfI http://localhost:5174/cadence-composer/ > /dev/null 2>&1; then
              echo "Server ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Server failed to start"
          cat /tmp/dev.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=firefox --workers=1 --reporter=html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload dev server logs on failure
        if: failure()
        run: cat /tmp/dev.log
